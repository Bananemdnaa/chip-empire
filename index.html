<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13080D">
<meta name="description" content="Browser-Casinospiel mit Spielgeld: Slots, Roulette, Blackjack und Crash.">
<title>Velvet Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-tier="0">
  <header class="top">
    <div class="brand">
      <div class="logo">Velvet Room</div>
      <div class="tier-line"><b id="tierName">Lobby</b><span id="tierLimits"></span></div>
    </div>
    <div class="wallet">
      <div class="bal-box"><span class="lbl">Chips</span><b id="bal" class="num">10.000</b></div>
      <div class="comp-box"><span class="lbl">Comps</span><b id="comp" class="num">0</b><button id="claimComp" class="btn ghost xs" type="button">Einlösen</button></div>
      <button id="reload" class="btn gold sm" type="button">+ Nachschub</button>
      <button id="sndBtn" class="btn ghost sm" type="button" aria-pressed="true" aria-label="Ton" title="Ton an/aus">🔊</button>
    </div>
    <div class="prog"><div class="prog-track"><i id="progBar"></i></div><span id="progTxt"></span></div>
  </header>

  <main class="layout">
    <section class="stage">
      <nav id="gameTabs" class="tabs game-tabs" role="tablist" aria-label="Spiele"></nav>
      <div id="g-slots" class="game"></div>
      <div id="g-roulette" class="game" hidden></div>
      <div id="g-bj" class="game" hidden></div>
      <div id="g-crash" class="game" hidden></div>
    </section>

    <aside class="host" aria-label="Hostess">
      <div class="host-card">
        <div id="hostPortrait" class="host-portrait"></div>
        <div class="host-meta">
          <div class="host-name" id="hostName">Mira</div>
          <div class="host-role" id="hostRole"></div>
        </div>
      </div>
      <p id="hostSay" class="say"></p>
      <div class="host-row">
        <button id="chatBtn" class="btn ghost sm" type="button">Plaudern</button>
        <button id="tipBtn" class="btn ghost sm" type="button">Trinkgeld</button>
      </div>
      <div class="meter">
        <div class="meter-h"><span class="lbl">Sympathie</span><b id="affTitle">Fremde</b><span id="affPerk" class="perk"></span></div>
        <div class="meter-track aff"><i id="affBar"></i></div>
      </div>
      <div class="meter">
        <div class="meter-h"><span class="lbl">Dopamin-Pegel</span><b id="dopaLbl">Ruhig</b></div>
        <div class="meter-track dopa"><i id="dopaBar"></i></div>
      </div>
      <label class="room-pick" for="roomSel"><span class="lbl">Raum</span><select id="roomSel"></select></label>
    </aside>
  </main>

  <section id="side" class="side" aria-label="Stufen, Profil und Statistik"></section>

  <div id="banner" class="banner" hidden role="status"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <footer class="foot">Velvet Room · Spielgeld ohne Wert, kein echtes Glücksspiel · Alle Figuren sind frei erfunden</footer>
</div>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/core.js"></script>
<script src="js/slots.js"></script>
<script src="js/roulette.js"></script>
<script src="js/blackjack.js"></script>
<script src="js/crash.js"></script>
<script src="js/side.js"></script>
<script src="js/main.js"></script>
</body>
</html>
