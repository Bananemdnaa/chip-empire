<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Velvet Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: Spieltisch links, Hostess rechts, darunter Stufen/Profil/Statistik. Eine bewusst dunkle Samt-und-Messing-Welt. */
:root {
  color-scheme: dark;
  --bg: #13080D;
  --velvet: #1E0D15;
  --velvet-2: #2A1420;
  --felt: #0D3A2C;
  --felt-2: #0A2C22;
  --gold: #D4AB52;
  --gold-hi: #F2D68E;
  --gold-lo: #8A6A2A;
  --crimson: #C4203F;
  --ivory: #F4EBDB;
  --muted: #B9A595;
  --line: rgba(212, 171, 82, .22);
  --good: #6FD3A2;
  --warn: #F0B84A;
  --tier: #3C1822;
  --f-display: "Limelight", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
#app[data-tier="0"] { --tier: #4A1D2A; }
#app[data-tier="1"] { --tier: #4A2A18; }
#app[data-tier="2"] { --tier: #3A2140; }
#app[data-tier="3"] { --tier: #4A2416; }
#app[data-tier="4"] { --tier: #222A40; }
#app[data-tier="5"] { --tier: #4E0C1E; }

html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ivory); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
#app {
  min-height: 100vh; padding-inline: 16px; padding-block: 0 24px; position: relative; overflow-x: hidden;
  background:
    radial-gradient(1200px 600px at 70% -10%, var(--tier), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px),
    var(--bg);
  transition: background .6s;
}
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fine { font-size: 12.5px; color: var(--muted); max-width: 70ch; margin: 10px 0 0; }
h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 18px 0 8px; font-weight: 700; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* ---------- Kopfzeile ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center;
  padding-block: 12px 10px; margin-inline: -16px; padding-inline: 16px; background: linear-gradient(var(--bg) 70%, rgba(19,8,13,.85)); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.logo { font-family: var(--f-display); font-size: 28px; line-height: 1; color: var(--gold-hi); letter-spacing: .02em; text-shadow: 0 0 18px rgba(242,214,142,.25); }
.tier-line { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.tier-line b { color: var(--ivory); font-weight: 700; }
.wallet { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: flex-end; }
.bal-box, .comp-box { display: flex; align-items: baseline; gap: 8px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(0,0,0,.25); }
.bal-box b { font-size: 20px; color: var(--gold-hi); min-width: 7ch; text-align: right; }
.comp-box b { font-size: 14px; }
.prog { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); }
.prog-track { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.prog-track i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-lo), var(--gold-hi)); transition: width .5s; }

/* ---------- Knöpfe ---------- */
.btn { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 600; letter-spacing: .01em;
  transition: transform .08s, background .2s, border-color .2s, box-shadow .2s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(212,171,82,.1); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.gold { background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); color: #2A1608; border-color: var(--gold-hi); box-shadow: 0 2px 0 #5C4318, 0 6px 18px rgba(212,171,82,.25); }
.btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #FFF0C2, var(--gold-hi) 55%, var(--gold)); }
.btn.crimson { background: var(--crimson); border-color: #E04462; color: #fff; }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.btn.xs { padding: 2px 9px; font-size: 12px; }
.btn.big { padding: 13px 26px; font-size: 16px; font-weight: 700; min-width: 13em; }
.btn.pulse { animation: pulse 1.4s infinite; }
.btn.shake { animation: shake .4s; }
.btn.cash { background: linear-gradient(180deg, #9CF0C6, var(--good) 55%, #2E9E6C); border-color: #BDF7DA; color: #052417; box-shadow: 0 2px 0 #1C5E40, 0 6px 18px rgba(111,211,162,.3); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(242,214,142,.25), 0 6px 18px rgba(212,171,82,.25); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* ---------- Layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; margin-top: 16px; align-items: start; }
.stage { min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--gold-hi); border-bottom-color: var(--gold); }
.tab:hover { color: var(--ivory); }
.game-tabs .tab { font-family: var(--f-display); font-size: 19px; font-weight: 400; letter-spacing: .03em; padding: 8px 16px; }
.game { background: radial-gradient(120% 90% at 50% 0%, var(--felt), var(--felt-2) 70%); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: inset 0 0 0 6px rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35); position: relative; }
.controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; justify-content: space-between; margin-top: 14px; }
.spinbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.betctl { display: grid; gap: 6px; }
.betrow { display: flex; align-items: center; gap: 8px; }
.betval { min-width: 7.5ch; text-align: center; font-family: var(--f-mono); font-size: 18px; font-weight: 600; color: var(--gold-hi); }
.presets { display: flex; gap: 6px; }
.chipbtn { border: 1px solid var(--line); background: rgba(0,0,0,.2); border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; }
.chipbtn:hover:not(:disabled) { border-color: var(--gold); }
.chipbtn.on, .chipbtn[aria-pressed="true"] { background: var(--gold); color: #2A1608; border-color: var(--gold-hi); }
.chipbtn:disabled { opacity: .4; cursor: not-allowed; }
.slot-msg { min-height: 1.45em; margin-top: 12px; color: var(--ivory); font-weight: 500; }
.slot-msg.win { color: var(--gold-hi); font-weight: 700; }
.note { margin-top: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(240,184,74,.12); border: 1px solid rgba(240,184,74,.35); font-size: 13px; }

/* ---------- Slots ---------- */
.reels-wrap { position: relative; padding: 12px; border-radius: 14px; background: linear-gradient(180deg, #2A1408, #120804); border: 2px solid var(--gold-lo);
  box-shadow: inset 0 0 0 1px var(--gold-hi), inset 0 10px 30px rgba(0,0,0,.6); }
.reels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.reel { display: grid; grid-template-rows: repeat(3, 1fr); gap: 6px; border-radius: 8px; background: linear-gradient(180deg, #0B0507, #1D0F14 20%, #1D0F14 80%, #0B0507); padding: 4px; overflow: hidden; }
.reel.spinning .cell { filter: blur(1.4px); transform: translateY(2px); }
.reel.land { animation: land .3s ease-out; }
@keyframes land { 0% { transform: translateY(-6px); } 60% { transform: translateY(3px); } 100% { transform: none; } }
.cell { aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: 6px; background: radial-gradient(circle at 50% 40%, #FFF8EA, #E9DCC4 70%, #CDBB9C); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); transition: opacity .25s, box-shadow .25s, transform .25s; }
.cell.win { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 18px rgba(242,214,142,.8); transform: scale(1.04); z-index: 1; }
.cell.dim { opacity: .35; }
.s { font-weight: 800; line-height: 1; user-select: none; }
.s-rank { font-family: var(--f-display); font-weight: 400; font-size: clamp(20px, 5.4vw, 40px); }
.rk0 { color: #2F6E5A; } .rk1 { color: #2D5B8C; } .rk2 { color: #7A3C8E; } .rk3 { color: #9E2A35; } .rk4 { color: #B07A1E; }
.s-gem, .s-scat { width: 74%; height: 74%; }
.s-bar { font-size: clamp(11px, 2.6vw, 19px); letter-spacing: .06em; color: #F4EBDB; background: #1A1014; border: 2px solid #D4AB52; padding: 4px 6px; border-radius: 4px; }
.s-seven { font-family: var(--f-display); font-size: clamp(30px, 7.6vw, 58px); color: #C4203F; text-shadow: 2px 2px 0 #6A0A1E, 0 0 1px #000; -webkit-text-stroke: 1px #6A0A1E; }
.s-wild { width: 86%; height: 62%; display: grid; place-items: center; border-radius: 6px; background: linear-gradient(135deg, #F2D68E, #B5862E); border: 2px solid #5C4318; }
.s-wild i { font-style: normal; font-family: var(--f-display); font-weight: 400; font-size: clamp(11px, 2.6vw, 20px); color: #3A1A08; letter-spacing: .04em; }
svg.lines { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); pointer-events: none; overflow: visible; }
.wl { fill: none; stroke: var(--gold-hi); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; opacity: .85; filter: drop-shadow(0 0 4px rgba(242,214,142,.9)); }
.free-banner { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); background: var(--crimson); color: #fff; padding: 4px 14px; border-radius: 999px; font-weight: 700; font-size: 13px; white-space: nowrap; border: 1px solid var(--gold-hi); max-width: 94%; overflow: hidden; text-overflow: ellipsis; }
.paytable { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.paytable summary { cursor: pointer; color: var(--gold); font-weight: 600; }
.pt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 10px; }
.pt-row { display: flex; align-items: center; gap: 10px; }
.pt-row.wide { grid-column: 1 / -1; }
.pt-sym { width: 40px; flex: none; }
.pt-sym .s-rank { font-size: 22px; } .pt-sym .s-seven { font-size: 30px; } .pt-sym .s-bar { font-size: 10px; padding: 2px 3px; } .pt-sym .s-wild i { font-size: 10px; }
.pt-txt { font-family: var(--f-mono); font-size: 12.5px; color: var(--ivory); min-width: 0; }

/* ---------- Roulette ---------- */
.rlayout { display: grid; grid-template-columns: minmax(200px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.rleft, .rright { min-width: 0; }
.wheel { position: relative; width: 100%; max-width: 300px; aspect-ratio: 1 / 1; margin: 0 auto; }
.wheel-rot, .ball-orbit { position: absolute; inset: 0; transition: transform 5.2s cubic-bezier(.12,.62,.16,1); }
.wheel-rot svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.ball-orbit .ball { position: absolute; left: 50%; top: 1.6%; width: 5%; aspect-ratio: 1 / 1; margin-left: -2.5%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #D9D9D9 60%, #8E8E8E); box-shadow: 0 1px 3px rgba(0,0,0,.6); transition: top .9s cubic-bezier(.5,0,.75,1.4); }
.ball-orbit.drop .ball { top: 13%; }
.pointer { position: absolute; left: 50%; top: -6px; width: 0; height: 0; margin-left: -7px; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid var(--gold-hi); filter: drop-shadow(0 1px 1px #000); }
.result-badge { position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: clamp(16px, 4vw, 24px); background: #1a0d10; border: 2px solid var(--gold); color: var(--ivory); }
.result-badge.red { background: #B3182F; } .result-badge.black { background: #15101A; } .result-badge.green { background: #0F6A4A; }
.rhist { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; justify-content: center; }
.hp { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-family: var(--f-mono); font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,.18); }
.hp.red { background: #B3182F; } .hp.black { background: #15101A; } .hp.green { background: #0F6A4A; }
.hp:first-child { box-shadow: 0 0 0 2px var(--gold-hi); }
.hotcold { display: grid; gap: 3px; margin-top: 10px; font-size: 12.5px; text-align: center; color: var(--muted); }
.hotcold .hot { color: #FF9A8A; } .hotcold .cold { color: #9AC4FF; }
.rscroll { overflow-x: auto; padding-bottom: 4px; }
.rboard { display: grid; grid-template-columns: 1.1fr repeat(12, 1fr) 1.1fr; grid-template-rows: repeat(3, 44px) 38px 38px; gap: 3px; min-width: 540px; }
.rcell { position: relative; border: 1px solid rgba(244,235,219,.55); border-radius: 4px; cursor: pointer; font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: #fff; display: grid; place-items: center; padding: 0; transition: box-shadow .15s, filter .15s; }
.rcell.red { background: #A9162C; } .rcell.black { background: #17111A; } .rcell.green { background: #0F6A4A; }
.rcell.out { background: rgba(0,0,0,.18); font-family: var(--f-body); font-size: 12.5px; font-weight: 600; }
.rcell:hover:not(:disabled) { filter: brightness(1.25); }
.rcell.won { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 16px rgba(242,214,142,.85); z-index: 1; }
.dia { display: block; width: 22px; height: 14px; transform: rotate(0); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.dia.red { background: #C4203F; } .dia.black { background: #0A0608; outline: 1px solid #fff; }
.rchip { position: absolute; right: 2px; bottom: 2px; min-width: 26px; height: 22px; padding: 0 4px; border-radius: 11px; background: var(--gold); color: #2A1608; font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; display: grid; place-items: center; border: 2px dashed #fff; box-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
.rctl { display: grid; gap: 10px; margin-top: 12px; justify-items: start; }
.rrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { width: 44px; height: 44px; border-radius: 50%; border: 3px dashed rgba(255,255,255,.85); background: radial-gradient(circle, #8E0E2B 55%, #5E0A1E 56%); font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; cursor: pointer; color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.chip.c2 { background: radial-gradient(circle, #1E5E8E 55%, #133F60 56%); }
.chip.c3 { background: radial-gradient(circle, #1A1418 55%, #000 56%); }
.chip.c4 { background: radial-gradient(circle, #5B2A8E 55%, #3C1A60 56%); }
.chip.c5 { background: radial-gradient(circle, #C79A3A 55%, #8A6A2A 56%); color: #2A1608; }
.chip.c6, .chip.c7 { background: radial-gradient(circle, #E8E2D4 55%, #A8A090 56%); color: #2A1608; }
.chip[aria-pressed="true"] { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--gold-hi), 0 6px 10px rgba(0,0,0,.5); }
.chip:disabled { opacity: .45; cursor: not-allowed; }
.rtotal { font-family: var(--f-mono); font-size: 13px; color: var(--gold-hi); }

/* ---------- Blackjack ---------- */
.bj-table { display: grid; gap: 14px; min-height: 330px; align-content: start; padding: 4px; background: radial-gradient(70% 50% at 50% 50%, rgba(255,255,255,.04), transparent); }
.bj-table::before { content: "BLACKJACK ZAHLT 3 ZU 2 · DEALER STEHT AUF SOFT 17"; display: block; text-align: center; font-size: 11px; letter-spacing: .18em; color: rgba(242,214,142,.55); order: 1; }
.bj-dealer { order: 0; }
.bj-msg { order: 2; text-align: center; min-height: 1.6em; font-weight: 700; font-size: 17px; }
.bj-msg.win { color: var(--gold-hi); } .bj-msg.lose { color: #FF9A8A; }
.bj-hands { order: 3; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.bj-shoe { order: 4; text-align: center; margin: 0 auto; }
.hand { padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; min-width: 0; }
.hand.active { border-color: var(--gold); background: rgba(242,214,142,.06); box-shadow: 0 0 0 3px rgba(242,214,142,.12); }
.hand-h { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px; justify-content: center; }
.hv { font-family: var(--f-mono); background: rgba(0,0,0,.35); padding: 1px 8px; border-radius: 999px; font-size: 13px; }
.hbet { font-family: var(--f-mono); font-size: 12px; color: var(--gold-hi); }
.hand-cards { display: flex; justify-content: center; min-height: 92px; }
.hand-cards.empty { align-items: center; color: var(--muted); font-size: 14px; }
.hand-cards .pcard + .pcard { margin-left: -26px; }
.pcard { position: relative; width: 64px; height: 90px; border-radius: 7px; background: linear-gradient(180deg, #FFFDF8, #F1E9DA); box-shadow: 0 2px 6px rgba(0,0,0,.45); border: 1px solid #CFC3AA; flex: none; }
.pcard.red { color: #B3182F; } .pcard.blk { color: #18121A; }
.pcard .cr { position: absolute; left: 6px; top: 4px; font-family: var(--f-mono); font-weight: 600; font-size: 16px; line-height: 1; }
.pcard .cs { position: absolute; left: 6px; top: 22px; font-size: 14px; line-height: 1; }
.pcard .cbig { position: absolute; right: 7px; bottom: 5px; font-size: 32px; line-height: 1; }
.pcard.back { background: repeating-linear-gradient(45deg, #8E0E2B 0 6px, #6A0A1E 6px 12px); border: 3px solid #F4EBDB; }
.pcard.back::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--gold-hi); border-radius: 4px; }
.pcard.deal { animation: deal .32s ease-out; }
@keyframes deal { from { transform: translate(40px, -40px) rotate(8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.hres { text-align: center; margin-top: 6px; font-weight: 700; font-size: 13px; }
.hres.win, .hres.blackjack { color: var(--gold-hi); } .hres.lose, .hres.bust { color: #FF9A8A; } .hres.push, .hres.surrender { color: var(--muted); }
.ins-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-top: 10px; padding: 10px; border-radius: 10px; background: rgba(0,0,0,.25); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.btn.act { min-width: 7.2em; }
.btn.act.rec { border-color: var(--gold-hi); box-shadow: 0 0 0 2px rgba(242,214,142,.35); }
.advice { text-align: center; min-height: 1.4em; font-size: 13px; color: var(--gold-hi); margin-top: 8px; }

/* ---------- Crash ---------- */
.crash-stage { position: relative; height: 300px; border-radius: 12px; background: linear-gradient(180deg, #0B1420, #0A0E16); border: 1px solid var(--line); overflow: hidden; }
.crash-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.crash-over { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 16px; }
.crash-mult { font-family: var(--f-mono); font-weight: 600; font-size: clamp(40px, 9vw, 72px); color: var(--ivory); text-shadow: 0 4px 20px rgba(0,0,0,.6); }
.crash-mult.live { color: var(--gold-hi); }
.crash-mult.dead { color: var(--crimson); }
.crash-sub { font-size: 14px; color: var(--muted); max-width: 40ch; }
.chist { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.cp { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid; }

function build() {

  cell('d1', '1. Dutzend', 'out', '2 / 6', '4'); cell('d2', '2. Dutzend', 'out', '6 / 10', '4'); cell('d3', '3. Dutzend', 'out', '10 / 14', '4');

function renderChips() {
  var S = V.S, list = V.chipList();
  if (list.indexOf(S.rchip) < 0) S.rchip = list[0];

  list.forEach(function (v) {
    chipsRow.appendChild(el('button', { class: 'chip c' + String(v).length, type: 'button', 'aria-pressed': String(v === S.rchip), text: short(v), 'aria-label': 'Chip ' + fmt(v),
      onclick: function () { S.rchip = v; V.Snd.click(); renderChips(); V.save(); } }));
  });
}

function renderBets() {
  var t = sum(bets);
  for (var k in cellMap) {
    var c = cellMap[k], amt = bets[k] || 0, ch = c.querySelector('.rchip');
    ch.hidden = amt <= 0; ch.textContent = amt > 0 ? short(amt) : '';
    c.classList.toggle('has', amt > 0);
  }
  totalEl.textContent = 'Auf dem Tisch: ' + fmt(t);

  spinBtn.disabled = off || t <= 0;
  undoBtn.disabled = off || stack.length === 0;
  clearBtn.disabled = off || t <= 0;
  rebetBtn.disabled = off || t > 0 || sum(last) <= 0;
  dblBtn.disabled = off || t <= 0;

function place(keys, amt) {
  var S = V.S, r = V.room();

function renderHist() {
  var S = V.S;
  histEl.innerHTML = '';
  S.rhist.slice(-14).reverse().forEach(function (n) {

  hotEl.appendChild(el('span', { class: 'cold', text: 'Kalt: ' + cold.map(function (x) { return x.n + ' (' + x.c + '×)'; }).join(', ') }));
  hotEl.appendChild(el('span', { class: 'fine', text: 'Beliebt, aber ohne Aussagekraft: Jede Zahl hat jedes Mal dieselbe Chance.' }));

async function spin() {
  if (spinning || resolving) return;
  var t = sum(bets);

  resultBadge.textContent = '…'; resultBadge.className = 'result-badge';
  ballOrbit.classList.remove('drop');
  wheelAngle = Math.ceil(wheelAngle / 360) * 360 + 1800 - (idx + 0.5) * d;
  ballAngle = Math.floor(ballAngle / 360) * 360 - 2160;
  wheelRot.style.transform = 'rotate(' + wheelAngle.toFixed(3) + 'deg)';
  ballOrbit.style.transform = 'rotate(' + ballAngle.toFixed(3) + 'deg)';
  var tk = setInterval(function () { V.Snd.tick(); }, 180);

  await sleep(5300);

  resultBadge.textContent = String(n); resultBadge.className = 'result-badge ' + E.rColor(n);
  spinning = false; resolving = true;
  V.settle('roulette', res.staked, res.ret, {});
  var net = res.ret - res.staked;
  for (var k in res.won) if (cellMap[k]) cellMap[k].classList.add('won');
  msgEl.className = 'slot-msg ' + (net > 0 ? 'win' : '');
  msgEl.textContent = 'Gewinnzahl ' + n + ' (' + COLORS[E.rColor(n)] + '). ' + (res.ret > 0
    ? 'Zurück: ' + fmt(res.ret) + ' Chips (' + (net >= 0 ? '+' : '') + fmt(net) + ')' : 'Kein Treffer, ' + fmt(res.staked) + ' Chips gehen ans Haus.');
  if (net > 0) {
    var ratio = res.ret / res.staked;
    if (ratio >= 8) { V.Snd.big(); V.burst(V.$('#g-roulette .wheel'), 30); V.banner(ratio >= 20 ? 'VOLLTREFFER' : 'BIG WIN', '+' + fmt(net) + ' Chips', { kind: 'win', ms: 2400 }); }
    else V.Snd.win();
  } else V.Snd.lose();
  renderHist(); renderBets();
  await sleep(2200);
  for (var k2 in cellMap) cellMap[k2].classList.remove('won');
  bets = {}; stack = []; resolving = false;
  renderBets();

V.games.push({
  id: 'roulette',
  init: build,
  onRoom: function () { renderChips(); renderBets(); },
  refresh: function () { renderBets(); }
});
})();

/* Velvet Room – Blackjack (6 Decks, Dealer steht auf soft 17, Blackjack zahlt 3:2) */
(function () {

  betCtl = V.betControl('bj');
  dealBtn = el('button', { class: 'btn gold big', type: 'button', text: 'Austeilen', onclick: deal });

    el('button', { class: 'btn ghost', type: 'button', text: 'Nein danke', onclick: function () { insure(false); } }));

  root.appendChild(el('p', { class: 'fine', text: '6 Decks, Dealer steht auf soft 17, Verdoppeln nach dem Teilen, bis zu 4 Hände, späte Aufgabe, Versicherung 2:1. Mit Basisstrategie liegt der Hausvorteil bei etwa 0,4 %. Ohne sie deutlich höher.' }));
  V.busyFns.push(function () { return busy || (st && st.phase !== 'done'); });

function active() { return st && st.phase !== 'done'; }

function renderBJ() {

      var hh = el('div', { class: 'hand-h' }, el('b', { text: st.hands.length > 1 ? 'Hand ' + (i + 1) : 'Du' }),
        el('span', { class: 'hv', text: valText(h.cards) }), el('span', { class: 'hbet', text: fmt(h.bet) }));
      var hc = el('div', { class: 'hand-cards' });

        var L = { win: 'Gewonnen', blackjack: 'Blackjack', push: 'Push', lose: 'Verloren', bust: 'Bust', surrender: 'Aufgegeben' }[h.result];
        var d = h.payout - h.bet;
        wrap.appendChild(el('div', { class: 'hres ' + h.result, text: L + (d !== 0 && h.result !== 'surrender' ? ' ' + (d > 0 ? '+' : '−') + fmt(Math.abs(d)) : (h.result === 'surrender' ? ' −' + fmt(h.bet - h.payout) : '')) }));
      }
      handsEl.appendChild(wrap);
    });
  }
  /* Schuh */
  if (shoe) {
    var left = Math.round((1 - shoe.pos / shoe.cards.length) * 100);
    shoeEl.textContent = 'Schuh: ' + left + ' % übrig, Mischen bei 25 %.';
  } else shoeEl.textContent = 'Frischer Schuh mit 6 Decks.';

  var inIns = st && st.phase === 'insurance' && !busy;

    insRow.querySelectorAll('button')[0].disabled = S.balance < cost;

  var last = pts[pts.length - 1], dot = document.createElementNS(NS, 'circle');

}

/* ===== ui_main.js ===== */
/* Velvet Room – Start, Navigation, Spielzeit */
(function () {
'use strict';
var $ = V.$, $$ = V.$$;
var GAMES = [{ id: 'slots', label: 'Slots' }, { id: 'roulette', label: 'Roulette' }, { id: 'bj', label: 'Blackjack' }, { id: 'crash', label: 'Crash' }];

function showGame(id) {
  var S = V.S;
  if (id !== S.game && V.isBusy()) {
    V.toast('Beende erst die laufende Runde oder nimm deine Chips vom Tisch.', 'bad'); renderNav(); return;
  }
  S.game = id;
  GAMES.forEach(function (g2) { $('#g-' + g2.id).hidden = g2.id !== id; });
  renderNav();
  V.games.forEach(function (g3) { if (g3.id === id && g3.onShow) g3.onShow(); });
  V.save();
}
function renderNav() {
  V.tabs($('#gameTabs'), GAMES, V.S.game, function (id) { V.Snd.click(); showGame(id); });
}
function syncSound() {
  var b = $('#sndBtn');
  b.setAttribute('aria-pressed', String(V.S.sound));
  b.textContent = V.S.sound ? 'Ton an' : 'Ton aus';
}
function hardReset() {
  try { localStorage.removeItem('velvet-room-v1'); } catch (e) { /* */ }
  location.reload();
}
V.showGame = showGame; V.syncSound = syncSound; V.hardReset = hardReset;

function init() {
  V.load();
  V.clampBets();
  V.games.forEach(function (g) { g.init(); });
  V.side.build();
  $('#reload').addEventListener('click', V.reload);
  $('#claimComp').addEventListener('click', V.claimComps);
  $('#tipBtn').addEventListener('click', V.tip);
  $('#chatBtn').addEventListener('click', function () { V.say('chat', true); });
  $('#roomSel').addEventListener('change', function (e) { if (!V.enterRoom(Number(e.target.value))) V.renderTier(); });
  $('#sndBtn').addEventListener('click', function () { V.S.sound = !V.S.sound; syncSound(); V.save(); if (V.S.sound) V.Snd.click(); });
  V.renderHost(); V.hud(); V.renderDopa(); syncSound();
  showGame(V.S.game);
  V.say('greet', true);
  var last = Date.now();
  setInterval(function () {
    var now = Date.now(), dt = now - last; last = now;
    if (!document.hidden && dt < 5000) {
      V.S.playMs += dt;
      V.S.dopa = Math.max(0, V.S.dopa - 0.15);
      V.renderDopa();
      if (Math.floor(V.S.playMs / 1000) % 15 === 0) { V.save(); V.maybeReality(); }
    }
  }, 1000);
  setInterval(function () { if (!V.isBusy() && Math.random() < 0.35) V.say('chat'); }, 45000);
  window.addEventListener('pagehide', V.save);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
